name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run ci

      - name: Smoke test OTP in headless Chrome
        run: |
          # Work around the pinned local Miniflare runtime's compatibility-date ceiling.
          # This only changes the disposable CI workspace, never the repository or production config.
          cp wrangler.jsonc "$RUNNER_TEMP/wrangler-original.jsonc"
          trap 'cp "$RUNNER_TEMP/wrangler-original.jsonc" wrangler.jsonc' EXIT
          sed -i 's/"compatibility_date": "2026-09-04"/"compatibility_date": "2026-05-22"/' wrangler.jsonc
          # The browser preview consumes date settings embedded at build time.
          npm run build
          node tests/otp-browser-smoke.mjs

      - name: Upload OTP browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otp-browser-screenshots
          path: screenshots/browser-smoke/*.png
          if-no-files-found: ignore
