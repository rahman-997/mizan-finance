name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use audited npm version supporting release-age policy
        run: |
          npm install --global npm@11.12.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Record npm dependency advisories (read-only)
        run: npm audit --json > dependency-audit.json || true

      - name: Upload dependency advisory report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-report
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Block moderate-or-higher dependency advisories, including build tools
        run: npm audit --audit-level=moderate

      - name: Validate project
        run: npm run ci
