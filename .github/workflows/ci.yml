name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use audited npm version supporting release-age policy
        run: |
          npm install --global npm@11.12.1
          npm --version

      - name: Confirm lockfile matches reviewed security overrides
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const before = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding: 'utf8'}));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const changed = {};
          for (const key of new Set([...Object.keys(before.packages||{}), ...Object.keys(after.packages||{})])) {
            if (JSON.stringify(before.packages?.[key]) !== JSON.stringify(after.packages?.[key])) {
              changed[key] = Object.hasOwn(after.packages, key) ? after.packages[key] : null;
            }
          }
          if (Object.keys(changed).length) {
            console.log('MIZAN_OVERRIDE_LOCK_BEGIN');
            console.log(Buffer.from(JSON.stringify({baseCount: Object.keys(before.packages).length, changed})).toString('base64'));
            console.log('MIZAN_OVERRIDE_LOCK_END');
            console.error('Lockfile needs review and commit: '+Object.keys(changed).length+' package entries differ');
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Record npm dependency advisories (read-only)
        run: npm audit --json > dependency-audit.json || true

      - name: Upload dependency advisory report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-report
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Block moderate-or-higher dependency advisories, including build tools
        id: security_audit
        run: npm audit --audit-level=moderate

      - name: Prepare review-only lockfile remediation proposal
        if: failure() && steps.security_audit.outcome == 'failure'
        run: |
          # Never commit proposals automatically; audit remains blocking.
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          node <<'NODE'
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          if(execFileSync('git',['diff','--','package.json'],{encoding:'utf8'}).trim()){
            throw new Error('Refusing proposal: package.json changed');
          }
          const previous=JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const updated=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(previous.lockfileVersion!==updated.lockfileVersion)throw new Error('Lockfile version changed');
          const oldPackages=previous.packages||{}, nextPackages=updated.packages||{};
          const changed={};
          for(const key of new Set([...Object.keys(oldPackages),...Object.keys(nextPackages)])){
            if(JSON.stringify(oldPackages[key])!==JSON.stringify(nextPackages[key])){
              changed[key]=Object.hasOwn(nextPackages,key)?nextPackages[key]:null;
            }
          }
          console.log('MIZAN_LOCK_PROPOSAL_BEGIN');
          console.log(Buffer.from(JSON.stringify({baseCount:Object.keys(oldPackages).length,changed})).toString('base64'));
          console.log('MIZAN_LOCK_PROPOSAL_END');
          console.log('Lockfile entries proposed: '+Object.keys(changed).length);
          NODE

      - name: Validate project
        run: npm run ci

      - name: Smoke test OTP in headless Chrome
        run: node tests/otp-browser-smoke.mjs

      - name: Upload OTP browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otp-browser-screenshots
          path: screenshots/browser-smoke/*.png
          if-no-files-found: ignore
