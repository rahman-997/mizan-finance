name: Dashboard browser QA

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dashboard-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install project
        run: npm ci
      - name: Install Chromium for pinned Playwright dependency
        run: npx playwright install --with-deps chromium
      - name: Start isolated browser-test server
        run: |
          npm run dev -- --config vite.browser.config.ts --host 127.0.0.1 --port 4173 > /tmp/mizan-v16-browser.log 2>&1 &
          echo $! > /tmp/mizan-v16-browser.pid
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mizan-v16-browser.log
          exit 1
      - name: Verify V16 across mobile, desktop, languages and privacy
        run: node tests/dashboard-browser.mjs
      - name: Verify backup restore and monthly-expense browser regressions
        run: CI= npm run test:browser
      - name: Server diagnostics
        if: failure()
        run: tail -n 180 /tmp/mizan-v16-browser.log || true
      - name: Save screenshots and QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-v16-browser-evidence
          path: |
            artifacts/dashboard-browser/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
