name: Bootstrap final project

on:
  push:
    paths:
      - '.bootstrap/full.part03'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild repository from final archive
        shell: bash
        run: |
          set -euo pipefail
          for part in .bootstrap/full.part00 .bootstrap/full.part01 .bootstrap/full.part02 .bootstrap/full.part03; do
            test -s "$part"
          done
          rm -rf /tmp/mizan-final
          mkdir -p /tmp/mizan-final
          cat .bootstrap/full.part00 .bootstrap/full.part01 .bootstrap/full.part02 .bootstrap/full.part03 | base64 -d | tar -xzf - -C /tmp/mizan-final
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mizan-final/. .

      - name: Commit final project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: publish final Mizan Finance project"
          git push origin HEAD:main
