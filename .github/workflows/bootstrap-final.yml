name: Bootstrap final project

on:
  push:
    paths:
      - '.bootstrap/source.full.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild repository from final archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.full.b64
          rm -rf /tmp/mizan-final
          mkdir -p /tmp/mizan-final
          base64 -d .bootstrap/source.full.b64 | tar -xzf - -C /tmp/mizan-final
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mizan-final/. .

      - name: Commit final project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: publish final Mizan Finance project"
          git push origin HEAD:main
